<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImpiloHealth-AI Prototype</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#9c27b0;--pd:#741683;--pink:#e91e8c;--bg:#fff5f9;--ink:#251728;--muted:#756777;--line:#eee2e9;--g:linear-gradient(135deg,#9c27b0,#b71c8f 55%,#e91e8c);--shadow:0 14px 36px #6f197f18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9c27b044;outline-offset:2px}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.welcome{min-height:100vh;background:linear-gradient(135deg,#4a075b,#9c27b0 50%,#e91e8c);color:#fff;display:grid;place-items:center;padding:24px;text-align:center}.welcome .lang{position:absolute;right:40px;top:32px}.welcome h1{font-size:clamp(40px,6vw,74px);line-height:1.1;max-width:850px;margin:24px}.logo{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700}.mark{width:48px;height:48px;border-radius:15px;background:#ffffff25;border:1px solid #ffffff44;display:grid;place-items:center}.btn{min-height:46px;border:0;border-radius:13px;padding:0 20px;font-weight:600;font-size:12px}.btn.white{background:#fff;color:var(--p)}.btn.brand{background:var(--g);color:#fff}.auth{min-height:100vh;display:grid;grid-template-columns:45% 55%}.auth-brand{background:var(--g);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}.auth-brand h1{font-size:45px}.auth-form{display:grid;place-items:center;padding:30px}.auth-card{width:min(470px,100%);background:#fff;padding:30px;border-radius:20px;box-shadow:var(--shadow)}.auth-card h2{font-size:28px}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0;font-size:10px}.field input,.field select{height:48px;border:1px solid var(--line);border-radius:11px;padding:0 12px}.auth-card .btn{width:100%;margin-top:12px}.link{border:0;background:transparent;color:var(--p);font-weight:600}.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.side .logo{justify-content:flex-start}.side .mark{background:var(--g);color:#fff;width:38px;height:38px}.group small{display:block;margin:20px 12px 7px;color:var(--muted);font-size:8px;font-weight:700;letter-spacing:.12em}.nav{width:100%;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:10px}.nav.active{background:var(--g);color:#fff}.user{margin-top:auto;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:9px}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:5}.top h2{font-size:17px}.top .tools{margin-left:auto;display:flex;gap:9px;align-items:center}.top input{height:40px;border:0;background:#faf5f8;border-radius:11px;padding:0 13px}.top select{height:40px;border:1px solid var(--line);border-radius:10px;background:#fff}.content{max-width:1250px;margin:auto;padding:24px}.hero{height:174px;background:var(--g);color:#fff;border-radius:18px;padding:30px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.hero h1{font-size:29px;margin:5px 0}.hero p{font-size:10px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}.card{background:#fff;border:1px solid #9c27b012;border-radius:18px;box-shadow:var(--shadow);padding:22px}.card:hover{transform:translateY(-3px)}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:1/-1}.label{font-size:9px;font-weight:700;color:var(--pd);letter-spacing:.1em}.modules{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.module{text-align:left;border:0;min-height:150px}.module .bubble{width:42px;height:42px;border-radius:12px;background:#f5e3f7;color:var(--p);display:grid;place-items:center}.module h3{font-size:13px}.module p,.muted{font-size:9px;color:var(--muted);line-height:1.6}.score{display:flex;align-items:center;gap:18px}.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--pink) 82%,#eee 0);display:grid;place-items:center}.ring:after{content:"82/100";width:84px;height:84px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700}.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.chips button{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:0 13px;font-size:9px}.tabs button.active,.chips button.active{background:var(--p);color:#fff}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product img{width:100%;height:145px;object-fit:cover;border-radius:12px}.product h3{font-size:12px}.product strong{display:block;margin:8px 0}.water{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.water button{height:45px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#999}.water button.on{background:#dff5ff;color:#1689bb}.map{width:100%;height:260px}.map path{fill:#f6e5f8;stroke:#c884cf}.map circle{fill:var(--pink);stroke:#fff;stroke-width:3}.modal{position:fixed;inset:0;background:#25172899;display:grid;place-items:center;z-index:20;padding:20px}.modal>div{background:#fff;border-radius:20px;padding:30px;width:min(480px,100%)}.toast{position:fixed;right:20px;bottom:20px;background:#241d25;color:#fff;border-radius:11px;padding:13px 17px;font-size:9px;z-index:30}.scanner{height:300px;background:radial-gradient(circle,#651a59,#171018 70%);border-radius:15px;color:#fff;display:grid;place-items:center;text-align:center}.chart{height:150px;display:flex;align-items:end;gap:12px}.chart i{flex:1;background:var(--g);border-radius:8px 8px 0 0}.bottom{display:none}.concept{font-size:8px;color:var(--muted);text-align:center;margin:18px}.hide{display:none!important}
@media(max-width:900px){.shell{grid-template-columns:76px 1fr}.side{padding:18px 10px}.side .logo span:last-child,.side .nav span,.side .group small,.user{display:none}.nav{justify-content:center}.modules{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}.span4,.span5,.span6,.span7,.span8{grid-column:1/-1}}
@media(max-width:600px){.auth{display:block}.auth-brand{display:none}.auth-form{min-height:100vh}.shell{display:block}.side{display:none}.top{padding:0 14px}.top input{display:none}.content{padding:14px 14px 88px}.hero{height:185px;padding:22px;align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}.grid,.modules,.products{display:block}.card,.module,.product{margin-bottom:14px}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:10}.bottom button{border:0;background:#fff;color:var(--muted);font-size:7px;display:flex;flex-direction:column;align-items:center;justify-content:center}.bottom button.active{color:var(--p)}.welcome .lang{right:18px;top:18px}.welcome h1{font-size:40px}.water{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div><script>
const S={screen:'welcome',lang:localStorage.getItem('demo-lang')||'English',cart:JSON.parse(localStorage.getItem('demo-cart')||'[]'),water:5,mood:'',symptoms:['Cramps'],flow:'Medium',donations:JSON.parse(localStorage.getItem('demo-donations')||'[]')};
const tr={English:{start:'Get Started',tag:'Your Health. Your Community. Powered by AI.',home:'Dashboard',health:'AI Health Chat',nutrition:'Smart Nutrition',community:'Community Hub',profile:'Profile'},Zulu:{start:'Qalisa',tag:'Impilo Yakho. Umphakathi Wakho. Ixhaswe yi-AI.',home:'Ikhaya',health:'Ingxoxo Yezempilo',nutrition:'Ukudla Okunempilo',community:'Umphakathi',profile:'Iphrofayela'},Sotho:{start:'Qala',tag:'Bophelo ba Hao. Setjhaba sa Hao. E tsamaiswa ke AI.',home:'Lehae',health:'Puisano ya Bophelo',nutrition:'Phepo e Bohlale',community:'Setjhaba',profile:'Profaele'},French:{start:'Commencer',tag:'Votre santé. Votre communauté. Propulsé par l’IA.',home:'Tableau de bord',health:'Assistant Santé IA',nutrition:'Nutrition intelligente',community:'Communauté',profile:'Profil'}};
function icon(n){const p={home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v11h14V10"/>',heart:'<path d="M20 4.6a5.5 5.5 0 0 0-8 1 5.5 5.5 0 0 0-9 6.8L12 21l8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',brain:'<path d="M9 4a4 4 0 0 0-3 6 4 4 0 0 0 3 7M15 4a4 4 0 0 1 3 6 4 4 0 0 1-3 7M9 4v16M15 4v16"/>',apple:'<path d="M12 21c-5 0-8-3-8-8 0-4 4-7 9-7 0 5-2 8-7 9M13 6c1-3 2-4 5-4 0 3-2 5-5 5"/>',users:'<circle cx="9" cy="7" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 7M22 21a6 6 0 0 0-5-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',bag:'<path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',camera:'<path d="M9 5 8 8H4v12h16V8h-4l-1-3H9Z"/><circle cx="12" cy="14" r="4"/>',spark:'<path d="m12 2 2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z"/>',water:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11Z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>'};return `<svg class="icon" viewBox="0 0 24 24">${p[n]||p.spark}</svg>`}
const labels=()=>tr[S.lang];function go(x){S.screen=x;render();scrollTo(0,0)}function toast(x){const d=document.createElement('div');d.className='toast';d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),1800)}
const nav=[['HEALTH','home','home','Dashboard'],['HEALTH','chat','brain','AI Health Chat'],['HEALTH','mood','heart','Mood & Wellness'],['HEALTH','cycle','heart',"Women's Health"],['CARE','shop','bag','Period Care Shop'],['CARE','nutrition','apple','Smart Nutrition'],['CARE','scan','camera','Nutrition Scanner'],['COMMUNITY','community','users','Community Hub'],['COMMUNITY','donate','spark','Donation Portal']];
function welcome(){return `<main class="welcome"><select class="lang" onchange="S.lang=this.value;localStorage.setItem('demo-lang',S.lang);render()">${['English','Zulu','Sotho','French'].map(x=>`<option ${x==S.lang?'selected':''}>${x}</option>`)}</select><div><div class="logo"><span class="mark">${icon('heart')}</span><span>ImpiloHealth-AI</span></div><h1>${labels().tag}</h1><p>Private, inclusive community health for South Africa.</p><button class="btn white" onclick="go('register')">${labels().start}</button></div></main>`}
function auth(register=true){return `<main class="auth"><section class="auth-brand"><div class="logo"><span class="mark">${icon('heart')}</span>ImpiloHealth-AI</div><div><h1>Healthier days start with one thoughtful step.</h1><p>Concept demo — AI features are simulated.</p></div></section><section class="auth-form"><form class="auth-card" onsubmit="event.preventDefault();go('home')"><span class="label">${register?'CREATE ACCOUNT':'WELCOME BACK'}</span><h2>${register?'Join ImpiloHealth-AI':'Continue your health journey'}</h2>${register?'<label class="field">Full Name<input required></label>':''}<label class="field">Email<input type="email" required></label><label class="field">Password<input type="password" minlength="8" required></label>${register?'<label class="field">Gender<select required><option></option><option>Female</option><option>Male</option><option>Prefer not to say</option></select></label><label class="field">Date of birth<input type="date" required></label><label class="field"><span><input type="checkbox" required> I consent under POPIA</span></label>':''}<button class="btn brand">${register?'Create Account':'Login'}</button><p class="muted">${register?'Already have an account?':'New here?'} <button type="button" class="link" onclick="go('${register?'login':'register'}')">${register?'Login':'Register'}</button></p></form></section></main>`}
function header(title,sub,action=''){return `<header class="hero"><div><span class="label" style="color:#fff">IMPILOHEALTH-AI</span><h1>${title}</h1><p>${sub}</p></div>${action}</header>`}
function dashboard(){return `${header('Good morning, Jennifer','How is your body feeling today?','<button class="btn white" onclick="go(\'chat\')">Ask Pangu</button>')}<div class="grid"><article class="card span4 score"><div class="ring"></div><div><span class="label">AI HEALTH SCORE</span><h3>Looking steady</h3><p class="muted">Mood is up 12%. Iron intake needs a boost.</p></div></article><section class="span8"><span class="label">YOUR HEALTH HUB</span><div class="modules">${[['brain','Personal Health AI','chat'],['heart',"Women's Health",'cycle'],['apple','Smart Nutrition','nutrition'],['users','Community Hub','community']].map(x=>`<button class="card module" onclick="go('${x[2]}')"><span class="bubble">${icon(x[0])}</span><h3>${x[1]}</h3><p>Open your personalised module</p></button>`).join('')}</div></section><article class="card span6"><span class="label">HUAWEI HEALTH</span><h3>Synced today at 08:42</h3><p>6,420 steps · 6h 45m sleep · 72 bpm</p></article><article class="card span6"><span class="label">APPGALLERY</span><h3>Offline-first for low-data areas</h3><p>HarmonyOS and wearable concept.</p></article></div>`}
function mood(){return `${header('Mood & Wellness','Notice your patterns and take a gentle pause.')}<div class="grid"><article class="card span7"><span class="label">WEEKLY MOOD · AVERAGE 3.3</span><div class="chart">${[40,65,50,90,55,75,68].map(x=>`<i style="height:${x}%"></i>`).join('')}</div></article><article class="card span5"><h3>How do you feel today?</h3><div class="chips">${['😢','😔','😐','🙂','😊','😄','🤩'].map(x=>`<button class="${S.mood==x?'active':''}" onclick="S.mood='${x}';toast('Check-in saved — ${x}');render()">${x}</button>`).join('')}</div></article><article class="card span12"><span class="label">PANGU AI · HUAWEI CLOUD</span><h3>AI noticed you’ve seemed stressed this week.</h3><p class="muted">Not a substitute for professional medical advice.</p><button class="btn brand" onclick="modal('Breathe in as the circle expands. Breathe out as it softens.')">Suggested: 5-min breathing exercise</button></article></div>`}
function chat(){return `${header('AI Health Assistant','Huawei Pangu NLP · powered by Huawei Cloud')}<article class="card"><p style="text-align:right"><b>I’ve been feeling tired and anxious lately</b></p><p>Thank you for sharing that. Try water, an iron-rich meal with morogo or beans, and a quieter bedtime. A nurse at a public clinic can help if this continues. Has your sleep changed?</p><div class="chips"><button>Why am I so tired?</button><button>Help me sleep better</button><button>I feel anxious</button></div><label class="field"><textarea placeholder="Tell Pangu what’s on your mind..."></textarea></label><button class="btn brand" onclick="toast('Simulated reply received')">Send</button><p class="muted">Not a substitute for professional medical advice. Concept demo — AI is simulated.</p></article>`}
function cycle(){return `${header('Next period — In 12 days','Day 18 of cycle · 5 days · AI Cycle Prediction')}<div class="grid"><article class="card span7"><h3>May 2025</h3><div class="modules">${Array.from({length:31},(_,i)=>`<button class="${i<5?'btn brand':'btn'}">${i+1}</button>`).join('')}</div></article><article class="card span5"><h3>Log symptoms</h3><div class="chips">${['Cramps','Bloating','Headache','Mood swings','Fatigue','Cravings'].map(x=>`<button class="${S.symptoms.includes(x)?'active':''}" onclick="S.symptoms.includes('${x}')?S.symptoms=S.symptoms.filter(y=>y!='${x}'):S.symptoms.push('${x}');render()">${x}</button>`).join('')}</div><h3>Flow</h3><div class="chips">${['Light','Medium','Heavy'].map(x=>`<button class="${S.flow==x?'active':''}" onclick="S.flow='${x}';render()">${x}</button>`).join('')}</div><button class="btn brand" onclick="toast('Cycle log saved')">Quick log</button><button class="link" onclick="go('shop')">Visit Period Care Shop</button></article></div><p class="concept">Not a substitute for professional medical advice. Prediction is simulated.</p>`}
const products=[['Ultra Comfort Pads','Pads',89],['Cotton Tampons','Tampons',72],['Cycle Care Bundle','Bundles',199],['Overnight Pads','Pads',99],['Organic Tampons','Tampons',85],['Hamper Add-on','Bundles',249]];let filter='All',query='';function shop(){let items=products.filter(x=>(filter=='All'||x[1]==filter)&&x[0].toLowerCase().includes(query.toLowerCase()));return `${header('Period Care Shop','Sample products · no checkout connected','<button class="btn white" onclick="modal(\'Cart contains '+S.cart.length+' items\')">Cart ('+S.cart.length+')</button>')}<div class="tabs"><input placeholder="Search" oninput="query=this.value;render()">${['All','Pads','Tampons','Bundles'].map(x=>`<button class="${filter==x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div>${items.length?`<div class="products">${items.map(x=>{let i=products.indexOf(x);return `<article class="card product"><img alt="Sample care products" src="https://images.unsplash.com/photo-1653784097013-786a8965ea3b?fit=crop&w=600&q=80"><h3>${x[0]}</h3><small>${x[1]}</small><strong>R${x[2]}</strong><button class="btn brand" onclick="S.cart.push(${i});localStorage.setItem('demo-cart',JSON.stringify(S.cart));toast('Added to cart');render()">Add to Cart</button></article>`}).join('')}</div>`:'<div class="card"><h3>No products match</h3></div>'}<button class="btn brand" onclick="go('donate')">Donate a Pack to a Girl in Need</button>`}
function nutrition(){return `${header('Smart Nutrition','Today · 1,240 of 2,000 kcal','<button class="btn white" onclick="go(\'scan\')">Scan a meal</button>')}<div class="grid"><article class="card span4"><div class="ring"></div><h3>1,240 / 2,000 kcal</h3></article><article class="card span8"><h3>Protein 62/90g</h3><h3>Carbs 148/230g</h3><h3>Fat 41/65g</h3></article><article class="card span12"><span class="label">AI INSIGHT</span><h3>You’ve been low on iron this week 🥬</h3><p class="muted">Add spinach, lentils or morogo. Not medical advice.</p></article><article class="card span7"><h3>Today’s meals</h3><p>Pap & morogo · 380 kcal</p><p>Chakalaka & rice · 540 kcal</p><p>Samp and beans · 320 kcal</p></article><article class="card span5"><h3>Water · ${S.water}/8</h3><div class="water">${Array.from({length:8},(_,i)=>`<button class="${i<S.water?'on':''}" onclick="S.water=${i+1};render()">${icon('water')}</button>`).join('')}</div></article></div>`}
function scan(){return `${header('Nutrition Scanner','Powered by HiLens · simulated')}<div class="grid"><section class="card span6"><div class="tabs"><button>Use camera</button><button>Upload photo</button><button>Type meal</button></div><div class="scanner"><div>${icon('camera')}<h3>Point camera at your meal</h3><button class="btn white" onclick="toast('Analysing with HiLens…');setTimeout(()=>modal('Detected: Grilled chicken & pap · 540 kcal'),1400)">Scan</button></div></div></section><section class="card span6"><h3>Detected food result</h3><p>Protein, carbs and fat estimates appear here after scanning.</p><input type="range" min=".5" max="2.5" step=".1"><p class="muted">Concept demo — scanning is simulated.</p></section></div>`}
function community(){return `${header('Community Hub','Impact across South Africa','<button class="btn white" onclick="support()">Request School Support</button>')}<div class="grid"><article class="card span4"><b>47</b><p>Schools supported</p></article><article class="card span4"><b>2,340</b><p>Girls reached</p></article><article class="card span4"><b>R18,500</b><p>Donations this month</p></article><article class="card span7"><h3>Where we work · 9 provinces</h3><svg class="map" viewBox="0 0 500 300"><path d="M60 70 150 35l80 25 70-18 65 35 65 15 35 70-45 70-90 35-90-15-90 15-70-60Z"/>${[[140,90],[250,90],[350,110],[390,190],[130,230]].map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="8"/>`).join('')}</svg></article><article class="card span5"><h3>Active NGO partners</h3><p>Sisters of Hope · Gauteng</p><p>Ubuntu Care Collective · KZN</p><p>Masiphumelele Trust · W. Cape</p><p>Bohlabela Youth Network · Limpopo</p><h3>Data access tiers</h3><p>Public impact · Partner data · Private health data</p></article></div>`}
function support(){modal('<h3>Request Support</h3><input placeholder="School name"><select><option>Gauteng</option><option>KwaZulu-Natal</option></select><button class="btn brand" onclick="closeModal();toast(\'Support request received\')">Submit</button>')}
function donate(){let total=S.donations.reduce((a,b)=>a+b.amount,0),girls=847+Math.floor(total/50);return `${header('Princess Hamper Project','Every R50 delivers a full hamper of sanitary products.')}<div class="grid"><article class="card span7"><h2>${girls} girls supported this month</h2><div class="chips">${[20,50,100].map(x=>`<button onclick="document.getElementById('amt').value=${x}">R${x}</button>`).join('')}<input id="amt" value="50" type="number"></div><label class="field"><span><input id="anon" type="checkbox"> Donate anonymously</span></label><button class="btn brand" onclick="pledge()">Record pledge</button><p class="muted">No money is charged in this concept.</p></article><article class="card span5"><h3>Recent donation activity</h3>${S.donations.length?S.donations.map(x=>`<p>${x.anonymous?'Anonymous':'Jennifer M.'} · R${x.amount}</p>`).join(''):'<p class="muted">No local pledges yet.</p>'}</article></div>`}function pledge(){let amount=+document.getElementById('amt').value,anonymous=document.getElementById('anon').checked;S.donations.unshift({amount,anonymous,ref:'IMP-'+Math.random().toString(36).slice(2,8).toUpperCase()});localStorage.setItem('demo-donations',JSON.stringify(S.donations));toast('Thank you — pledge recorded');render()}
function profile(){return `${header('Profile & Settings','Jennifer Mkhonto · Free Plan')}<div class="grid"><aside class="card span4"><h3>Settings</h3><p>Profile</p><p>Notifications</p><p>Privacy</p><p>Language</p><p>Subscription</p></aside><section class="card span8"><span class="label">HEALTH PROFILE · SAMPLE DATA</span><p>Age 29 · Blood O+ · Height 165cm · Last check-up 12 May 2025</p><label class="field">Language<select onchange="S.lang=this.value;localStorage.setItem('demo-lang',S.lang);render()">${['English','Zulu','Sotho','French'].map(x=>`<option ${x==S.lang?'selected':''}>${x}</option>`)}</select></label><p><input type="checkbox" checked> Health reminders</p><p><input type="checkbox" checked> Community updates</p><p><input type="checkbox" checked> POPIA data controls</p><button class="btn">Export CSV</button> <button class="btn">Export PDF</button><br><button class="btn brand" onclick="go('welcome')">Log out</button></section></div>`}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal" onclick="if(event.target==this)closeModal()"><div>${typeof html=='string'?html:' '}<br><button class="link" onclick="closeModal()">Close</button></div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
function shell(){let last='';const side=nav.map(x=>{let h='';if(x[0]!=last){last=x[0];h=`<small>${x[0]}</small>`}return `${h}<button class="nav ${S.screen==x[1]?'active':''}" onclick="go('${x[1]}')">${icon(x[2])}<span>${x[3]}</span></button>`}).join('');let pages={home:dashboard,chat,mood,cycle,shop,nutrition,scan,community,donate,profile};return `<div class="shell"><aside class="side"><div class="logo"><span class="mark">${icon('heart')}</span><span>ImpiloHealth-AI</span></div><nav class="group">${side}</nav><div class="user">JM · Jennifer Mkhonto<br><small>Free plan</small></div></aside><main><header class="top"><h2>${nav.find(x=>x[1]==S.screen)?.[3]||'Dashboard'}</h2><div class="tools"><input placeholder="Search"><select onchange="S.lang=this.value;localStorage.setItem('demo-lang',S.lang);render()">${['English','Zulu','Sotho','French'].map(x=>`<option ${x==S.lang?'selected':''}>${x}</option>`)}</select></div></header><section class="content">${(pages[S.screen]||dashboard)()}<p class="concept">Concept demo — Pangu, HiLens, Huawei Health and payments are simulated.</p></section><nav class="bottom">${[['home','home','Home'],['chat','brain','Health'],['nutrition','apple','Nutrition'],['community','users','Community'],['profile','user','Profile']].map(x=>`<button class="${S.screen==x[0]?'active':''}" onclick="go('${x[0]}')">${icon(x[1])}${x[2]}</button>`).join('')}</nav></main></div>`}
function render(){document.getElementById('app').innerHTML=S.screen=='welcome'?welcome():S.screen=='register'?auth(true):S.screen=='login'?auth(false):shell()}render();
</script></body></html>
